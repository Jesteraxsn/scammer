<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIT Student Registration</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <form id="registrationForm">
            <h2>WIT Student Registration Form</h2>
            
            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName" required>
                <span class="error" id="firstNameError"></span>
            </div>
            
            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" required>
                <span class="error" id="lastNameError"></span>
            </div>
            
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>
                <span class="error" id="emailError"></span>
            </div>
            
            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required>
                <span class="error" id="dobError"></span>
            </div>
            
            <div class="form-group">
                <label for="username">Set Username</label>
                <input type="text" id="username" name="username" required>
                <span class="error" id="usernameError"></span>
            </div>
            
            <div class="form-group">
                <label for="password">Set Password</label>
                <input type="password" id="password" name="password" required>
                <span class="error" id="passwordError"></span>
            </div>
            
            <div class="form-group">
                <label>Gender</label>
                <div class="radio-group">
                    <input type="radio" id="GIRL" name="gender" value="GIRL" required>
                    <label for="GIRL">GIRL</label>
                    <input type="radio" id="BOY" name="gender" value="BOY">
                    <label for="BOY">BOY</label>
                    <input type="radio" id="bakla" name="gender" value="bakla">
                    <label for="bakla">bakla</label>
                    <input type="radio" id="tomboy" name="gender" value="tomboy">
                    <label for="tomboy">tomboy</label>
                 
                </div>
                <span class="error" id="genderError"></span>
            </div>
            
            <div class="form-group">
                <label for="course">Course</label>
                <select id="course" name="course" required>
                    <option value="">Select Course</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Engineering">Engineering</option>
                    <option value="Business">Business</option>
                    <option value="information tecnology">information tecnology</option>
                </select>
                <span class="error" id="courseError"></span>
            </div>
            
            <button type="submit" class="register-btn">Register</button>
        </form>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
